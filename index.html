<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioCode | AI Triage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            CardioCode
        </div>
        <div class="header-center">Medical Tech Demo</div>
        <div class="header-right">
            <span class="time" id="clock"></span>
            <button class="menu-btn">Menu</button>
        </div>
    </header>

    <main class="hero">
        <div class="bg-text">CARDIOCODE</div>
        
        <div class="hero-content">
            <div class="glass-card" id="card">
                <h2 id="card-title">AI Heart Diagnosis</h2>
                <p id="card-desc">Upload patient data for instant risk stratification.</p>
                
                <form id="triage-form" style="display:none; text-align:left;">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
                        <input type="number" id="age" placeholder="Age" required value="60">
                        <input type="number" id="sex" placeholder="Sex (1=M, 0=F)" required value="1">
                        <input type="number" id="cp" placeholder="CP Type (0-3)" required value="2">
                        <input type="number" id="trestbps" placeholder="Rest BP" required value="140">
                        <input type="number" id="chol" placeholder="Cholesterol" required value="250">
                        <input type="number" id="thalach" placeholder="Max HR" required value="150">
                    </div>
                    <button type="submit" class="primary-btn">Analyze Risk</button>
                </form>

                <div id="result-view" style="display:none; margin-top:20px;">
                    <h1 id="r-score" style="font-size:36px; margin-bottom:5px;"></h1>
                    <p id="r-level" style="font-weight:600; font-size:18px; margin-bottom:15px;"></p>
                    <p id="r-rec" style="font-size:14px; color:var(--text-secondary);"></p>
                    <button class="primary-btn" onclick="resetForm()" style="margin-top:20px;">New Triage</button>
                </div>

                <button class="primary-btn" id="start-triage">Start Triage</button>
            </div>
            
            <div id="alert-toast" class="alert-toast"></div>
        </div>

        <div class="footer-info">
            <p>Autonomous ML diagnostic systems.</p>
            <p class="subtext">Precision that secures patient health.</p>
        </div>
    </main>

    <script>
        // Clock
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').innerText = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // UI Flow
        const startBtn = document.getElementById('start-triage');
        const form = document.getElementById('triage-form');
        const resultView = document.getElementById('result-view');
        const title = document.getElementById('card-title');
        const desc = document.getElementById('card-desc');

        startBtn.onclick = () => {
            startBtn.style.display = 'none';
            form.style.display = 'block';
            title.innerText = 'Patient Metrics';
            desc.style.display = 'none';
        };

        window.resetForm = () => {
            resultView.style.display = 'none';
            form.style.display = 'block';
            title.innerText = 'Patient Metrics';
            desc.style.display = 'none';
        }

        // API Integration
        form.onsubmit = async (e) => {
            e.preventDefault();
            form.style.display = 'none';
            title.innerText = 'Analyzing...';
            
            const payload = {
                patient_record_id: "test-patient",
                doctor_uid: "test-doc",
                hospital_id: "hosp-1",
                age: +document.getElementById('age').value,
                sex: +document.getElementById('sex').value,
                cp: +document.getElementById('cp').value,
                trestbps: +document.getElementById('trestbps').value,
                chol: +document.getElementById('chol').value,
                fbs: 0, restecg: 1, 
                thalach: +document.getElementById('thalach').value, 
                exang: 1, oldpeak: 2.0, slope: 1, ca: 0, thal: 2
            };

            try {
                const res = await fetch('http://localhost:8000/api/v1/triage/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                title.innerText = 'Diagnosis Complete';
                document.getElementById('r-score').innerText = (data.risk_score * 100).toFixed(1) + '%';
                const levelEl = document.getElementById('r-level');
                levelEl.innerText = data.risk_level + ' Risk';
                levelEl.style.color = data.risk_level === 'High' || data.risk_level === 'Critical' ? '#ff3b30' : (data.risk_level === 'Moderate' ? '#ff9500' : '#34c759');
                document.getElementById('r-rec').innerText = data.recommendation;
                resultView.style.display = 'block';
            } catch(e) {
                title.innerText = 'Error';
                alert('API Error: Is the server running?');
                resetForm();
            }
        };

        // Real-Time SSE Alerts
        const evtSource = new EventSource("http://localhost:8000/api/v1/alerts/stream");
        evtSource.addEventListener("critical_alert", (e) => {
            const data = JSON.parse(e.data);
            const toast = document.getElementById('alert-toast');
            toast.innerText = data.message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 5000);
        });
    </script>
</body>
</html>
