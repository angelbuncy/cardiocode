# ─── CardioCode Docker Compose ────────────────────────────────────
version: "3.9"

services:
  api:
    build: .
    container_name: cardiocode-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./app/ml_models:/app/app/ml_models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  redis:
    image: redis:7-alpine
    container_name: cardiocode-redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: cardiocode-celery
    command: celery -A app.worker.tasks worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - redis
